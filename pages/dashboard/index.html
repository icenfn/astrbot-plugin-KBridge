<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>KBridge</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div class="app">
    <!-- 侧边导航（桌面） -->
    <aside class="sidebar">
      <div class="brand">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 3l8 4.5v9L12 21l-8-4.5v-9L12 3z" />
          <path d="M12 12l8-4.5M12 12v9M12 12L4 7.5" />
        </svg>
        <span>KBridge</span>
      </div>
      <nav class="nav">
        <button class="nav-item active" data-view="overview">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
          <span>总览</span>
        </button>
        <button class="nav-item" data-view="platforms">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="5" r="2.5"/><circle cx="5" cy="19" r="2.5"/><circle cx="19" cy="19" r="2.5"/><path d="M12 7.5v4M12 11.5c0 4-7 3.5-7 5.5M12 11.5c0 4 7 3.5 7 5.5"/></svg>
          <span>平台配置</span>
        </button>
        <button class="nav-item" data-view="subs">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
          <span>同步管理</span>
        </button>
        <button class="nav-item" data-view="schedule">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
          <span>定时任务</span>
        </button>
      </nav>
      <div class="sidebar-foot">
        <span id="side-sync" class="sync-pill hidden">
          <span class="spinner"></span>同步中
        </span>
        <span class="ver">v0.1.0</span>
      </div>
    </aside>

    <!-- 内容区 -->
    <main class="content">
      <header class="topbar">
        <h1 id="view-title">总览</h1>
        <div class="topbar-actions">
          <span id="sync-pill" class="sync-pill hidden">
            <span class="spinner"></span>同步中…
          </span>
          <button id="btn-refresh" class="btn icon" title="刷新">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
          </button>
        </div>
      </header>

      <section id="view-overview" class="view active"></section>
      <section id="view-platforms" class="view"></section>
      <section id="view-subs" class="view"></section>
      <section id="view-schedule" class="view"></section>
    </main>
  </div>

  <!-- 底部导航（移动端） -->
  <nav class="tabbar">
    <button class="tab-item active" data-view="overview">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
      <span>总览</span>
    </button>
    <button class="tab-item" data-view="platforms">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="5" r="2.5"/><circle cx="5" cy="19" r="2.5"/><circle cx="19" cy="19" r="2.5"/><path d="M12 7.5v4M12 11.5c0 4-7 3.5-7 5.5M12 11.5c0 4 7 3.5 7 5.5"/></svg>
      <span>平台</span>
    </button>
    <button class="tab-item" data-view="subs">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
      <span>同步</span>
    </button>
    <button class="tab-item" data-view="schedule">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
      <span>定时</span>
    </button>
  </nav>

  <div id="toast-wrap"></div>
  <script src="/api/plugin/page/bridge-sdk.js"></script>
  <script type="module" src="./app.js"></script>
</body>
</html>
